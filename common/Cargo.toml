[package]
name = "common"
version = "4.9.1"
edition = "2024"
authors = ["Airbus Seclab <seclab+soxy@airbus.com>"]
repository = "https://github.com/airbus-seclab/soxy"
license-file = "../LICENSE"

[dependencies.copyrs]
version = "0"
optional = true
default-features = false
features = [ "wl-clipboard-rs", "x11-clipboard" ]

[dependencies.crossbeam-channel]
version = "0"
default-features = false
features = [ "std" ]

[dependencies.log]
version = "0"
optional = true
default-features = false
features = [ "std" ]

[dependencies.network-interface]
version = "2"
optional = true
default-features = false

[dependencies.simplelog]
version = "0"
optional = true
default-features = false
features = [ "local-offset", "termcolor" ]

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
must_use_candidate = "allow"
enum_glob_use = "allow"
missing_errors_doc = "allow"
nursery = { level = "deny", priority = -1 }
or_fun_call = "allow"
significant_drop_tightening = "allow"

[features]
log = [ "dep:log", "dep:simplelog" ]
backend = [ "dep:copyrs", "dep:network-interface" ]
frontend = [ ]
service-clipboard = [ ]
service-command = [ ]
service-forward = [ ]
service-ftp = [ ]
service-input = [ ]
service-socks5 = [ ]
service-stage0 = [ ]
